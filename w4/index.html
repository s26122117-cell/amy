<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友對我的動態留言板</title>

  <style>
    /* ==========================================================================
       【1. 主題顏色與變數設定區】
       可以在這裡方便地調整黑粉視覺風格、霓虹發光度與輪播速度
       ========================================================================== */
    :root {
      /* 【背景顏色】深黑紫底色，打造高級暗黑氛圍 */
      --bg-dark: #0a0a0f;             
      
      /* 【卡片背景】深灰黑卡片色 */
      --card-bg: #14141c;             
      
      /* 【主要粉色】霓虹粉紅 (Neon Pink) - 用於高亮卡片邊框、發光主色 */
      --pink-primary: #ff2a85;        
      
      /* 【次要粉色】柔粉紅 - 用於名字、圖示與重點標題 */
      --pink-soft: #ff75b5;           
      
      /* 【粉色光暈】RGB 格式，方便用 rgba 控制發光透明度 */
      --pink-glow-rgb: 255, 42, 133; 
      
      /* 一般文字與次要文字 */
      --text-main: #f0f0f5;           
      --text-sub: #8a8a9e;            
      
      /* 卡片預設邊框顏色 */
      --border-color: #242432;        

      /* 卡片切換動畫流暢度 (單位: 秒) */
      --transition-speed: 0.5s;       
    }

    /* 全局重置 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      padding: 2.5rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* 頂部標題 */
    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    header h1 {
      font-size: 2.6rem;
      font-weight: 800;
      color: var(--pink-primary);
      text-transform: uppercase;
      letter-spacing: 3px;
      /* 霓虹粉紅發光文字效果 */
      text-shadow: 0 0 12px rgba(var(--pink-glow-rgb), 0.8),
                   0 0 24px rgba(var(--pink-glow-rgb), 0.4);
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-sub);
      font-size: 1rem;
      letter-spacing: 1px;
    }

    /* ==========================================================================
       【2. 酷炫載入中動畫 (Loading Animation)】
       ========================================================================== */
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 5rem;
    }

    .neon-spinner {
      width: 65px;
      height: 65px;
      border: 4px solid rgba(var(--pink-glow-rgb), 0.15);
      border-top: 4px solid var(--pink-primary);
      border-radius: 50%;
      /* 旋轉動畫 */
      animation: spin 1s linear infinite;
      box-shadow: 0 0 20px rgba(var(--pink-glow-rgb), 0.5);
    }

    .loading-text {
      margin-top: 1.5rem;
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--pink-soft);
      letter-spacing: 2px;
      /* 呼吸燈動畫 */
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.02); }
    }

    /* ==========================================================================
       【3. 瀑布流排版 (Masonry Layout)】
       ========================================================================== */
    .masonry-wall {
      width: 100%;
      max-width: 1200px;
      /* 使用 CSS column-count 實現多欄瀑布流 */
      column-count: 4;          /* 預設 4 欄 (適用於桌面大螢幕) */
      column-gap: 1.5rem;       /* 欄位之間的間距 */
      display: none;            /* 載入完成前先隱藏 */
    }
