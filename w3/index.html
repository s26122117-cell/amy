<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>韓風自定義迷因產生器 | Meme Generator</title>
    
    <!-- 1. 引入 Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Outfit:wght@400;600;800&family=Impact&display=swap" rel="stylesheet">
    
    <!-- 2. 引入 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 3. 引入 FontAwesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 4. 引入 html2canvas CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body {
            font-family: 'Outfit', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #fef6f6 0%, #f3f4f6 50%, #f0f4ff 100%);
            min-height: 100vh;
        }

        .k-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 30px -5px rgba(180, 160, 200, 0.12);
        }

        .meme-text {
            font-family: 'Impact', 'Noto Sans KR', sans-serif;
            text-transform: uppercase;
            word-wrap: break-word;
            line-height: 1.2;
            user-select: none;
            text-shadow: 
                2px 2px 0 #000, -2px -2px 0 #000, 
                2px -2px 0 #000, -2px 2px 0 #000,
                0px 2px 0 #000, 0px -2px 0 #000, 
                2px 0px 0 #000, -2px 0px 0 #000,
                3px 3px 5px rgba(0,0,0,0.5);
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: #f1f5f9;
            height: 8px;
            border-radius: 4px;
            outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #a855f7;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(168, 85, 247, 0.4);
            transition: transform 0.1s ease;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        .upload-dropzone {
            border: 2px dashed #cbd5e1;
            transition: all 0.2s ease;
        }
        .upload-dropzone:hover {
            border-color: #a855f7;
            background-color: rgba(243, 232, 255, 0.3);
        }

        .btn-gradient {
            background: linear-gradient(135deg, #c084fc 0%, #e879f9 50%, #f472b6 100%);
            background-size: 200% 200%;
            animation: gradientMove 4s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="p-4 md:p-8 text-slate-800">

    <header class="max-w-6xl mx-auto mb-6 text-center">
        <div class="inline-flex items-center gap-2 bg-purple-100 text-purple-700 px-4 py-1.5 rounded-full text-xs font-semibold tracking-wider mb-2 uppercase">
            <i class="fa-solid fa-sparkles"></i> Korean Aesthetic Meme Studio
        </div>
        <h1 class="text-3xl md:text-4xl font-extrabold text-slate-800 tracking-tight">
            ✨ 韓風迷因產生器
        </h1>
        <p class="text-slate-500 text-sm mt-1">輕鬆製作高品質、韓系可愛又搞笑的專屬梗圖</p>
    </header>

    <main class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        
        <!-- 左側控制面板 -->
        <section class="lg:col-span-5 space-y-5">
            <div class="k-card p-6 rounded-3xl">
                
                <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-purple-500"></i> 控制面板 (Controls)
                </h2>

                <div class="space-y-4">
                    
                    <!-- 1. 本機圖片上傳區塊 -->
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">
                            1. 底圖選擇 (Upload Image)
                        </label>
                        
                        <label for="imageInput" class="upload-dropzone cursor-pointer rounded-2xl p-4 flex flex-col items-center justify-center gap-1 text-center bg-white/50">
                            <i class="fa-solid fa-cloud-arrow-up text-2xl text-purple-400"></i>
                            <span class="text-xs font-medium text-slate-600">點擊上傳本機圖片</span>
                            <span class="text-[10px] text-slate-400">支援 JPG, PNG, WEBP (自動轉 Base64 防 CORS)</span>
                        </label>
                        <input type="file" id="imageInput" accept="image/*" class="hidden">

                        <div class="mt-2 flex items-center gap-2">
                            <span class="text-[11px] text-slate-400 font-medium">快捷範例：</span>
                            <button type="button" onclick="loadPreset('cat')" class="text-xs bg-slate-100 hover:bg-purple-100 text-slate-600 hover:text-purple-600 px-2.5 py-1 rounded-lg transition">🐱 震驚貓咪</button>
                            <button type="button" onclick="loadPreset('dog')" class="text-xs bg-slate-100 hover:bg-purple-100 text-slate-600 hover:text-purple-600 px-2.5 py-1 rounded-lg transition">🐶 無辜狗鉤</button>
                        </div>
                    </div>

                    <hr class="border-slate-100">

                    <!-- 2. 文字內容輸入區塊 -->
                    <div class="space-y-3">
                        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider">
                            2. 梗圖文字 (Text Inputs)
                        </label>
                        
                        <div>
                            <span class="text-[11px] text-slate-500 font-medium">上方文字 Top Text</span>
                            <input type="text" id="topTextInput" placeholder="輸入上方文字..." value="當代大學生狀態" 
                                class="w-full mt-1 px-3.5 py-2 text-sm bg-white/80 border border-slate-200 rounded-xl focus:ring-2 focus:ring-purple-400 focus:outline-none transition">
                        </div>

                        <div>
                            <span class="text-[11px] text-slate-500 font-medium">下方文字 Bottom Text</span>
                            <input type="text" id="bottomTextInput" placeholder="輸入下方文字..." value="這樣合理嗎？" 
                                class="w-full mt-1 px-3.5 py-2 text-sm bg-white/80 border border-slate-200 rounded-xl focus:ring-2 focus:ring-purple-400 focus:outline-none transition">
                        </div>

                        <div class="flex flex-wrap gap-1.5 pt-1">
                            <span class="text-[11px] text-slate-400 font-medium self-center">流行文案：</span>
                            <button onclick="applyTextPreset('這合理嗎？', '我不理解')" class="text-[11px] bg-purple-50 text-purple-600 hover:bg-purple-100 px-2 py-0.5 rounded-md">這合理嗎？</button>
                            <button onclick="applyTextPreset('表面平靜', '內心崩潰')" class="text-[11px] bg-purple-50 text-purple-600 hover:bg-purple-100 px-2 py-0.5 rounded-md">表面平靜</button>
                            <button onclick="applyTextPreset('神清氣爽', '準備下班')" class="text-[11px] bg-purple-50 text-purple-600 hover:bg-purple-100 px-2 py-0.5 rounded-md">神清氣爽</button>
                        </div>
                    </div>

                    <hr class="border-slate-100">

                    <!-- 3. 參數滑桿微調區塊 -->
                    <div class="space-y-3">
                        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider">
                            3. 版面調整 (Layout Sliders)
                        </label>

                        <div>
                            <div class="flex justify-between text-xs text-slate-500 mb-1">
                                <span>字體大小 Size</span>
                                <span id="fontSizeVal" class="font-bold text-purple-600">36px</span>
                            </div>
                            <input type="range" id="fontSizeSlider" min="20" max="70" value="36">
                        </div>

                        <div>
                            <div class="flex justify-between text-xs text-slate-500 mb-1">
                                <span>上方文字位置 Top Position</span>
                                <span id="topPosVal" class="font-bold text-purple-600">5%</span>
                            </div>
                            <input type="range" id="topPosSlider" min="2" max="40" value="5">
                        </div>

                        <div>
                            <div class="flex justify-between text-xs text-slate-500 mb-1">
                                <span>下方文字位置 Bottom Position</span>
                                <span id="bottomPosVal" class="font-bold text-purple-600">5%</span>
                            </div>
                            <input type="range" id="bottomPosSlider" min="2" max="40" value="5">
                        </div>
                    </div>

                    <hr class="border-slate-100">

                    <!-- 4. 文字顏色選取 -->
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-bold text-slate-600 uppercase tracking-wider">
                            文字顏色 Text Color
                        </label>
                        <div class="flex items-center gap-2">
                            <input type="color" id="textColorPicker" value="#ffffff" class="w-8 h-8 rounded-lg cursor-pointer border-0 bg-transparent">
                            <span class="text-xs text-slate-400">點擊選色</span>
                        </div>
                    </div>

                    <!-- 5. 下載按鈕 -->
                    <div class="pt-2">
                        <button id="downloadBtn" class="btn-gradient w-full py-3.5 px-6 rounded-2xl text-white font-bold text-sm shadow-lg shadow-purple-200 hover:shadow-purple-300 transition-all flex items-center justify-center gap-2 active:scale-95">
                            <i class="fa-solid fa-download"></i> 一鍵下載迷因圖 (Download PNG)
                        </button>
                    </div>

                </div>
            </div>
        </section>

        <!-- 右側迷因預覽區 -->
        <section class="lg:col-span-7">
            <div class="k-card p-4 md:p-6 rounded-3xl sticky top-8">
                
                <div class="flex items-center justify-between mb-3">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                        <i class="fa-solid fa-eye text-purple-400"></i> 即時預覽 (Live Preview)
                    </span>
                    <span class="text-[11px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded-md">WYSIWYG</span>
                </div>

                <div class="w-full bg-slate-900 rounded-2xl overflow-hidden shadow-inner flex items-center justify-center min-h-[320px] max-h-[600px]">
                    <div id="memeContainer" class="relative inline-block overflow-hidden max-w-full select-none">
                        <img id="memeImage" src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=800&q=80" 
                             alt="Meme Background" 
                             class="w-full h-auto max-h-[550px] object-contain block mx-auto">

                        <div id="topTextDisplay" class="meme-text absolute w-full left-0 text-center px-4 font-black text-white pointer-
